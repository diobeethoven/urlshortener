version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: urlshortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer connection pooler
  pgbouncer:
    image: pgbouncer:1.21
    container_name: urlshortener-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6543:6543"
    environment:
      POOL_MODE: transaction
      MAX_CLIENT: 100
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 3
      POOL_HARVEST_PERcentage: 50
      AUTH_TYPE: trust
      AUTH_USER: postgres
      AUTH_PASSWORD: postgres
    volumes:
      - pgbouncer_data:/var/lib/pgbouncer
    healthcheck:
      test: ["CMD", "pgbouncer", "-c", "/etc/pgbouncer/pgbouncer.ini", "-t", "/tmp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, counters, and rate limiting
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS JetStream for async click logging
  nats:
    image: nats:2-alpine
    container_name: urlshortener-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command: ["-js"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClickHouse for click analytics
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: urlshortener-clickhouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: default
      POSTGRES_PASSWORD: ""
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - ch_data:/var/lib/clickhouse/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8123/?q=SELECT+1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ClickHouse keeper (using Zookeeper for cluster)
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:24.3
    container_name: urlshortener-clickhouse-keeper
    restart: unless-stopped
    environment:
      - CLICKHOUSE_KEEPER_CLUSTER=shortener_cluster
    ports:
      - "9123:9123"
    depends_on:
      - clickhouse
      - zookeeper

  # Zookeeper for ClickHouse keeper
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: urlshortener-zookeeper
    restart: unless-stopped
    environment:
      - ZOOKEEPER_HOSTNAME=zookeeper
      - ZOOKEEPER_ADVERTISED_HOST_NAME=zookeeper
      - ZOOKEEPER_PORT_NUMBER=2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  # Node.js API service (Fastify)
  api:
    build:
      context: .
      dockerfile: urlshortener-api/Dockerfile
    container_name: urlshortener-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@pgbouncer:6543/urlshortener?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      NATS_URL: "nats://nats:4222"
      CLICKHOUSE_URL: "http://clickhouse:8123"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/shorten"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.53
    container_name: urlshortener-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - postgres
      - redis
      - nats
      - clickhouse

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.4
    container_name: urlshortener-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # Envoy load balancer
  envoy:
    image: envoyproxy/envoy:v1.31
    container_name: urlshortener-envoy
    restart: unless-stopped
    volumes:
      - ./docker/envoy:/etc/envoy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - postgres
      - redis

volumes:
  pg_data:
  redis_data:
  ch_data:
  pgbouncer_data:
  zookeeper_data: