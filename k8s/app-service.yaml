apiVersion: v1
kind: Service
metadata:
  name: urlshortener
  namespace: urlshortener
  labels:
    app: urlshortener
spec:
  selector:
    app: urlshortener
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urlshortener-ingress
  namespace: urlshortener
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: short.url
      http:
        paths:
          - path: /api/shorten
            pathType: Prefix
            backend:
              service:
                name: urlshortener
                port:
                  number: 9090
          - path: /{code}
            pathType: Prefix
            backend:
              service:
                name: urlshortener
                port:
                  number: 9090